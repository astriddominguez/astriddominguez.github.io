# Configuración del blog. Tras cambiar este archivo, GitHub reconstruye el sitio solo.
title: Astricode
author:
  name: Astrid
description: >-
  Blog de desarrollo de software: programación, backend, buenas prácticas, tecnología e IA, explicados de forma clara y con ejemplos prácticos.
lang: es

url: "https://astriddominguez.github.io"
baseurl: ""

# Versión nueva del tema minima (tiene modo oscuro)
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

minima:
  # Colores. Opciones: auto (claro/oscuro según el visitante), classic (claro),
  # dark (oscuro), solarized-light, solarized-dark, solarized (auto con tonos solarized)
  skin: dark
  date_format: "%d/%m/%Y"
  # Iconos de redes en el pie de página
  social_links:
    - { platform: github, user_url: "https://github.com/astriddominguez" }

header_pages:
  - temas.md
  - about.md

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
